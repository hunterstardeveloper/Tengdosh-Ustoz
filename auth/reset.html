<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password • Tengdosh Ustoz</title>
  <link rel="ico" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: radial-gradient(circle at top, #111827, #030712);
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:rgba(255,255,255,0.10);
      --card:linear-gradient(135deg, rgba(31,41,55,0.82), rgba(17,24,39,0.62));
      --input:rgba(2,6,23,0.55);
      --primary:#7c8cff;
      --danger:#fca5a5;
      --ok:#86efac;
      --shadow:0 20px 40px rgba(0,0,0,0.35);
    }
    [data-theme="light"]{
      --bg: radial-gradient(circle at top, #f4f9ffd3, #fbfbfb);
      --text:#1f2937;
      --muted:#6b7280;
      --border:rgba(17,24,39,0.10);
      --card:linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,255,255,0.55));
      --input:rgba(255,255,255,0.85);
      --primary:#4f7cff;
      --shadow:0 20px 40px rgba(0,0,0,0.12);
    }

    *{box-sizing:border-box}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow-x:hidden;
    }

    .wrap{width:100%;max-width:430px;position:relative}
    .card{
      width:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:22px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }

    .brand{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .logo{width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:rgba(124,140,255,0.12);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary)}
    h1{margin:0;font-size:20px;letter-spacing:0.2px}
    .sub{margin:6px 0 0;color:var(--muted);font-size:13px}

    label{display:block;font-size:13px;margin-top:14px;color:var(--muted)}
    input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--input);
      color:var(--text);
      margin-top:8px;
      outline:none;
      transition:border-color .15s ease;
      font-family:inherit;
    }
    input:focus{border-color:rgba(124,140,255,0.65)}

    button{
      width:100%;
      margin-top:16px;
      padding:12px;
      border:0;
      border-radius:14px;
      background:var(--primary);
      color:white;
      font-weight:800;
      font-family:inherit;
      letter-spacing:0.2px;
      cursor:pointer;
      transition:transform .12s ease, opacity .2s ease;
    }
    button:hover{transform:translateY(-1px)}
    button:disabled{opacity:.6;cursor:not-allowed;transform:none}

    .msg{font-size:13px;min-height:18px;margin-top:10px}
    .msg.ok{color:var(--ok)}
    .msg.err{color:var(--danger)}

    .row{display:flex;gap:10px;align-items:center;margin-top:14px}
    .row a{color:var(--primary);text-decoration:none;font-size:13px}
    .row a:hover{text-decoration:underline}

    .hint{font-size:12px;color:var(--muted);margin-top:10px}

    #theme-toggle{
      position:absolute;
      right:10px;
      top:-64px;
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      box-shadow:var(--shadow);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:transform .12s ease;
    }
    #theme-toggle:hover{transform:translateY(-1px)}
  </style>
</head>
<body>
  <div class="wrap">
    <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="card">
      <div class="brand">
        <div class="logo">TU</div>
        <div>
          <h1>Reset password</h1>
          <p class="sub">We'll send a reset link to your email</p>
        </div>
      </div>

      <div class="msg" id="msg"></div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />

      <button id="btn">Send reset email</button>

      <div class="row">
        <a href="/auth/login.html">← Back to sign in</a>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="/assets/firebase-config.js"></script>
  <script src="/assets/tu-firebase.js"></script>
  <script>
    TU.init();

    // theme
    (function initTheme(){
      let saved = null;
      try { saved = sessionStorage.getItem('tu_theme'); } catch(e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { sessionStorage.setItem('tu_theme', next); } catch(e) {}
    });

    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    function setMsg(t, ok){
      msg.textContent = t || '';
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function doReset(){
      btn.disabled = true;
      setMsg('', true);
      try {
        const email = document.getElementById('email').value.trim();
        if (!email) throw new Error('Enter your email');
        if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Enter a valid email');
        await TU.auth.sendPasswordResetEmail(email);
        setMsg('Reset email sent — check your inbox (and spam).', true);
      } catch (e) {
        setMsg(e?.message || 'Failed to send reset email', false);
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', doReset);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doReset();
    });
  </script>

  <script src="/assets/UI.js"></script>
	<script src="/sw.js"></script>
	<script src="/script-internet-checker.js"></script>
</body>
</html>

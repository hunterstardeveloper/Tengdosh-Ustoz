<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tengdosh-Ustoz | Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="ico" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #7c8cff;
      --border: rgba(255,255,255,0.45);
      --card-bg: rgba(249, 250, 251, 0.5);
      --glow: rgba(124, 140, 255, 0.3);
      --bg-gradient: radial-gradient(circle at top, #f4f9ffd3, #fbfbfb);
      --btn-bg: white;
      --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.35));
    }

    [data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at top, #111827, #030712);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #a5b4fc;
      --border: rgba(255,255,255,0.1);
      --card-bg: rgba(31, 41, 55, 0.7);
      --btn-bg: #1f2937;
      --glass-bg: linear-gradient(135deg, rgba(31, 41, 55, 0.8), rgba(17, 24, 39, 0.6));
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    #theme-toggle {
      position: fixed; bottom: 25px; right: 25px; z-index: 1000;
      width: 50px; height: 50px; background: var(--primary);
      color: white; border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .back {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      background: var(--btn-bg);
      border-radius: 50%;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid var(--border);
    }

    .back img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    [data-theme="dark"] .back img { filter: brightness(0) invert(1); }

    .back:hover { transform: scale(1.1); }
    .back:active { transform: scale(0.9); }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border-radius: 30px;
    }

    .top {
      padding: 50px 0 20px;
      display: flex;
      justify-content: center;
    }

    .icon-top {
      height: 180px;
      width: 180px;
      border-radius: 50%;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      object-fit: cover;
      border: 6px solid var(--btn-bg);
      box-shadow: 0 15px 30px rgba(0,0,0,0.1), 0 0 0 10px rgba(124, 140, 255, 0.05);
      cursor: pointer;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .section-title {
      text-align: center;
      margin: 20px 0 40px;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      background: linear-gradient(to right, #4f46e5, #7c8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .features {
      max-width: 1100px;
      margin: 0 auto 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      padding: 0 20px;
      align-items: start;
    }

    .card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card-img-container {
      width: 100%;
      height: 350px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid var(--border);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .card:hover img { 
      transform: scale(1.07) translateY(-5px); 
    }

    .card h3 { margin-bottom: 10px; font-size: 22px; color: var(--text); }

    .card a { 
      font-weight: 600; 
      color: var(--primary); 
      text-decoration: none;
      padding: 12px 24px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: fit-content;
      transition: all 0.3s ease;
    }

    .card a:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(124, 140, 255, 0.2);
    }
    .card-footer {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: auto;
      width: 100%;
    }
  </style>
</head>
<body>

  <button id="theme-toggle" aria-label="Toggle Theme">
    <svg id="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <a class="back" href="/clubs/english/teachers-sec-eng.html">
    <img src="https://cdn-icons-png.flaticon.com/512/271/271220.png" alt="go back" draggable="false">
  </a>

  <header class="top">
    <div style="pointer-events: auto;">
       <img src="https://ik.imagekit.io/yefypajb8v/Elements/english%20techers/Asadbek.webp?updatedAt=1771684253384" class="icon-top" id="main-logo" alt="English" draggable="false">
    </div>
  </header>

  <h1 class="section-title">Asadbek Musurmonov</h1>

  <main class="features">
    <div class="card glass">
      <div class="card-img-container">
        <img src="https://play-lh.googleusercontent.com/75IlCYPLTex3HvRpnyzXcjOf4PeEYZVSy7Vlu89ed4CLH9mhBcPY0zDOTym5df-ydk8=w480-h960" alt="Online" draggable="false">
      </div>
      <h3 style="text-align: center;">Study online</h3>
    
      <div class="card-footer">
        <a href="/clubs/english/Asadbek/online.html">Explore the online course</a>
      </div>
    </div>

    <div class="card glass">
      <div class="card-img-container">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1140&q=80" alt="Mentor" draggable="false">
      </div>
      <h3 style="text-align: center;">Attend Class</h3>
      <div class="card-footer">
        <a  href="/clubs/english/Asadbek/offline.html">Attend in person</a>
      </div>
    </div>
  </main>

<script>
  // Dark Mode Logic
  const toggleBtn = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const moonSVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  const sunSVG = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

  const savedTheme = sessionStorage.getItem('theme') || 'light';
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeIcon.innerHTML = sunSVG;
  }

  toggleBtn.addEventListener('click', () => {
    let theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.innerHTML = moonSVG;
      sessionStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.innerHTML = sunSVG;
      sessionStorage.setItem('theme', 'dark');
    }
  });

  const allCards = document.querySelectorAll('.card');

  allCards.forEach(card => {
    card.addEventListener('mouseenter', () => {
      card.style.transform = "translateY(-15px)";
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = "translateY(0)";
    });
  });

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = "1";
        entry.target.style.transform = "translateY(0)";
      }
    });
  }, { threshold: 0.1 });

  allCards.forEach(el => {
    el.style.opacity = "0";
    el.style.transform = "translateY(30px)";
    el.style.transition = "all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
    revealObserver.observe(el);
  });
</script>

</body>
</html>

async function pickAvatar(el) {
  if (!auth.currentUser) {
    alert("Avatar tanlash uchun avval akkauntga kiring.");
    const root = getRootPathSafe();
    window.location.href = `${root}/auth/login.html`;
    return;
  }

  selectedUserAvatar = el.src;

  try {
    await db.ref(`users/${auth.currentUser.uid}`).update({
      avatarURL: selectedUserAvatar,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
    });

  }
}

function toYouTubeEmbed(url){
  if(!url) return '';
  const raw=String(url).trim();
  if(!raw) return '';
  if(raw.includes('youtube.com/embed/')) return raw;
  try{
    const u=new URL(raw);
    const host=u.hostname.replace(/^www\./,'');
    if(host==='youtu.be'){
      const id=u.pathname.split('/').filter(Boolean)[0];
      return id?`https://www.youtube.com/embed/${id}`:raw;
    }
    if(host.endsWith('youtube.com')){
      if(u.pathname==='/watch'){
        const id=u.searchParams.get('v');
        return id?`https://www.youtube.com/embed/${id}`:raw;
      }
      const parts=u.pathname.split('/').filter(Boolean);
      if(parts[0]==='shorts' && parts[1]) return `https://www.youtube.com/embed/${parts[1]}`;
      if(parts[0]==='live' && parts[1]) return `https://www.youtube.com/embed/${parts[1]}`;
    }
  }catch(e){}
  return raw;
}

function selectCourse(index) {

  const videoSection = document.getElementById('videoSection');
  const videoPlayer = document.getElementById('videoPlayer');
  const videoIframe = document.getElementById('videoIframe');
  const noVideoMsg = document.getElementById('noVideoMsg');

  currentCourseKey = data.qa.replace(/[.#$/[\]]/g, "_");

  videoSection.classList.add('open');

  if (data.video) {
    videoPlayer.style.display = 'block';
    noVideoMsg.style.display = 'none';
    videoIframe.src = toYouTubeEmbed((typeof data.video === 'string' ? data.video : ''));
} else {
    videoPlayer.style.display = 'none';
    noVideoMsg.style.display = 'block';
    videoIframe.src = "";
  }

  document.getElementById('qa-container').innerHTML = `<div class="content-card"><p>${data.qa}</p></div>`;

  document.getElementById('task-container').innerHTML = data.tasks.map(t => 
    `<div class="content-card task">${t}</div>`
  ).join('');

  document.getElementById('doc-container').innerHTML = (data.docs||[]).map(d => `<div class="content-card pdf"><a href="${(String(d.link||'').startsWith('/') ? String(d.link) : '/' + String(d.link))}" target="_blank" rel="noopener"><i data-lucide="file-text" class="inline-icon"></i> ${d.title||'Fayl'}</a></div>`).join('');
document.getElementById('download-container').innerHTML = (data.downloads||[]).map(dl => `<div class="content-card pdf"><a href="${(String(dl.link||'').startsWith('/') ? String(dl.link) : '/' + String(dl.link))}"><i data-lucide="download" class="inline-icon"></i> ${dl.title||'Yuklab olish'}</a></div>`).join('');
if (window.lucide) lucide.createIcons();

  loadFeedbacks();

  setTimeout(() => {
    document.querySelector('.tab').focus();
    videoSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function loadFeedbacks() {
  const list = document.getElementById('feedback-list');
  list.innerHTML = ""; 

  db.ref(`feedbacks/${CLUB_ID}/${TEACHER_ID}/${currentCourseKey}`).on('value', (snapshot) => {
    const data = snapshot.val();
    list.innerHTML = ""; 
    
    if (!data) {
      list.innerHTML = "<p style='color:var(--muted); font-size:0.9rem;'>Hozircha fikrlar yo'q.</p>";
      return;
    }

    Object.values(data).reverse().forEach(fb => {
      const specialClass = fb.isAdmin ? 'admin-comment' : '';

      list.innerHTML += `
      <div class="content-card ${specialClass}">
        <div class="comment-user-box">
          <img src="${(/^https?:\/\//.test(fb.avatar||"") ? (fb.avatar||"") : (String(fb.avatar||"").startsWith("/") ? (fb.avatar||"") : ("/"+(fb.avatar||"")))) ||'https://cdn-icons-png.flaticon.com/512/8241/8241956.png'}" class="comment-avatar">
          <div style="flex-grow:1;">
            <strong>${(fb.displayName || ((fb.name||"") + " " + (fb.surename||""))).trim()} ${fb.group ? '<small>(' + fb.group + ')</small>' : ''}</strong>
          </div>
        </div>
        <p style="margin-left: 52px;">${fb.message}</p>
      </div>`;
    });
  });
}

let currentUserProfile = null;
let currentUserRole = 'guest';

function getRootPathSafe(){
  try {
    return (window.TU && TU.getRootPath) ? TU.getRootPath() : '';
  } catch(e){
    return '';
  }
}

async function loadCurrentUserProfile() {
  return new Promise((resolve) => {
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        currentUserProfile = null;
        currentUserRole = 'guest';
        updateFeedbackUI();
        return resolve(null);
      }
      try {
        currentUserRole = await TU.getRole(db, user.uid);
        const snap = await db.ref(`users/${user.uid}`).once('value');
        const doc = snap.val() || {};

        const displayName = (doc.displayName || user.displayName || (user.email ? user.email.split('@')[0] : 'User')).trim();
        const surename = (doc.surename || '').trim();
        const group = (doc.groupInUniversity || doc.group || '').trim();
        const avatar = (doc.avatarURL || doc.photoURL || user.photoURL || 'https://cdn-icons-png.flaticon.com/512/8241/8241956.png');

        currentUserProfile = {
          uid: user.uid,
          email: user.email || '',
          displayName,
          surename,
          group,
          avatar,
          role: currentUserRole,
        };

        // keep avatar variable used by UI
        selectedUserAvatar = avatar;
      } catch (e) {
        console.warn(e);
      }

      updateFeedbackUI();
      resolve(currentUserProfile);
    });
  });
}

function updateFeedbackUI() {
  const identitySection = document.getElementById('identity-section');
  const avatarWrapper = document.querySelector('.avatar-selection-wrapper');
  const welcome = document.getElementById('welcome-user');
  const nameField = document.getElementById('fb-name');
  const surnameField = document.getElementById('fb-surname');
  const groupField = document.getElementById('fb-group');

  if (!identitySection) return;

  // If not logged in, keep the inputs visible but do NOT save to localStorage anymore
  if (!currentUserProfile) {
    identitySection.style.display = 'block';
    if (avatarWrapper) avatarWrapper.style.display = 'block';
    if (welcome) welcome.style.display = 'none';
    return;
  }

  // Logged in -> use account info (no localStorage identity)
  identitySection.style.display = 'none';
  if (avatarWrapper) avatarWrapper.style.display = 'none';

  if (nameField) nameField.value = currentUserProfile.displayName || '';
  if (surnameField) surnameField.value = currentUserProfile.surename || '';
  if (groupField) groupField.value = currentUserProfile.group || '';

  if (welcome) {
    const g = currentUserProfile.group ? ` <small>(${currentUserProfile.group})</small>` : '';
    welcome.innerHTML = `
      <img src="${safeAssetUrl(currentUserProfile.avatar)}" style="width:35px;height:35px;border-radius:50%;vertical-align:middle;margin-right:10px;border: 2px solid var(--primary);">
      <span>Fikr qoldiruvchi: <strong>${currentUserProfile.displayName}</strong>${g}</span>
    `;
    welcome.style.display = 'flex';
    welcome.style.alignItems = 'center';
  }
}

function normalizeName(str) {
  if (!str) return "";
  return str.toLowerCase()
    .replace(/x/g, 'h')
    .replace(/X/g, 'H')
    .replace(/kh/g, 'h')
    .replace(/Kh/g, 'H')
    .replace(/o'/g, 'o')
    .replace(/O'/g, 'O')
    .replace(/g'/g, 'g')
    .replace(/G'/g, 'G')
    .replace(/\s+/g, '');
}

async function submitFeedback() {
  const messageField = document.getElementById('fb-message');
  const message = (messageField?.value || '').trim();

  if (!message) {
    alert("Iltimos, xabar maydonini to'ldiring!");
    return;
  }

  // Must be logged in to submit feedback
  if (!currentUserProfile || !auth.currentUser) {
    alert("Feedback qoldirish uchun avval akkauntga kiring.");
    const root = getRootPathSafe();
    window.location.href = `${root}/auth/login.html`;
    return;
  }

  // If user didn't set a display name, force them to set it in Account page
  if (!currentUserProfile.displayName || currentUserProfile.displayName.length < 2) {
    alert("Account sahifasidan ismingizni sozlab oling.");
    const root = getRootPathSafe();
    window.location.href = `${root}/pages/account/account.html`;
    return;
  }

  const courseRef = db.ref(`feedbacks/${CLUB_ID}/${TEACHER_ID}/${currentCourseKey}`);

  try {
    // Admin/teacher is ONLY from DB role (no secret keys / no DevTools hacks)
    const role = currentUserRole || 'user';
    const feedbackEntry = {
      uid: auth.currentUser.uid,
      displayName: currentUserProfile.displayName,
      surename: currentUserProfile.surename || '',
      group: currentUserProfile.group || '',
      message: message,
      avatar: currentUserProfile.avatar || 'https://cdn-icons-png.flaticon.com/512/8241/8241956.png',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      isAdmin: role === 'admin',
      isTeacher: role === 'teacher'
    };

    await courseRef.push(feedbackEntry);
    messageField.value = "";
  } catch (err) {
    alert("Xatolik yuz berdi: " + (err?.message || err));
  }
}

const slider = document.getElementById('videoScrollable');
let isDown = false;
let startX;
let scrollLeft;

if (slider) {
  slider.addEventListener('mousedown', (e) => {
    isDown = true;
    startX = e.pageX - slider.offsetLeft;
    scrollLeft = slider.scrollLeft;
  });
  slider.addEventListener('mouseleave', () => isDown = false);
  slider.addEventListener('mouseup', () => isDown = false);
  slider.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - slider.offsetLeft;
    const walk = (x - startX) * 2; 
    slider.scrollLeft = scrollLeft - walk;
  });
}

  }
}

<script>
document.addEventListener('DOMContentLoaded', () => {
    const makeFocusable = () => {
        document.querySelectorAll('.course-card, .tab, .avatar-item').forEach(el => {
            if (!el.hasAttribute('tabindex')) {
                el.setAttribute('tabindex', '0');
            }
        });
    };
    makeFocusable();
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;
        const focusableSelectors = 'a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
        const elements = Array.from(document.querySelectorAll(focusableSelectors))
            .filter(el => el.offsetWidth > 0 && el.offsetHeight > 0);
        if (elements.length === 0) return;

        const firstEl = elements[0];
        const lastEl = elements[elements.length - 1];

        if (e.shiftKey && document.activeElement === firstEl) {
            e.preventDefault();
            lastEl.focus();
        } else if (!e.shiftKey && document.activeElement === lastEl) {
            e.preventDefault();
            firstEl.focus();
        }
    });
    document.addEventListener('keydown', (e) => {
        const active = document.activeElement;
        if ((e.key === 'Enter' || e.key === ' ') && 
            (active.classList.contains('course-card') || active.classList.contains('tab') || active.classList.contains('avatar-item'))) {
            e.preventDefault();
            active.click();
        }
        if (active.classList.contains('course-card')) {
            const cards = Array.from(document.querySelectorAll('.course-card'));
            const idx = cards.indexOf(active);
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                (cards[idx + 1] || cards[0]).focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                (cards[idx - 1] || cards[cards.length - 1]).focus();
            }
        }

        if (active.classList.contains('tab')) {
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const idx = tabs.indexOf(active);
            let nextTab;
            if (e.key === 'ArrowRight') nextTab = tabs[idx + 1] || tabs[0];
            if (e.key === 'ArrowLeft') nextTab = tabs[idx - 1] || tabs[tabs.length - 1];
            
            if (nextTab) {
                nextTab.focus();
                nextTab.click();
            }
        }
    });

    const observer = new MutationObserver(makeFocusable);
    observer.observe(document.body, { childList: true, subtree: true });
});

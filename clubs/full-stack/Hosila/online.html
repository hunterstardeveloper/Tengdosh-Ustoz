function safeAssetUrl(u){
  const s = String(u || '').trim();
  if (!s) return '';
  if (/^(https?:\/\/|data:|blob:|\/\/)/i.test(s)) return s;
  if (s.startsWith('/')) return s;
  return '/' + s;
}
function resolveAvatarUrl(value) {
  const normalized = safeAssetUrl(value);
  return normalized || 'https://cdn-icons-png.flaticon.com/512/8241/8241956.png';
}

function toYouTubeEmbed(url){
  if(!url) return '';
  const raw=String(url).trim();
  if(!raw) return '';
  if(raw.includes('youtube.com/embed/')) return raw;
  try{
    const u=new URL(raw);
    const host=u.hostname.replace(/^www\./,'');
    if(host==='youtu.be'){
      const id=u.pathname.split('/').filter(Boolean)[0];
      return id?`https://www.youtube.com/embed/${id}`:raw;
    }
    if(host.endsWith('youtube.com')){
      if(u.pathname==='/watch'){
        const id=u.searchParams.get('v');
        return id?`https://www.youtube.com/embed/${id}`:raw;
      }
      const parts=u.pathname.split('/').filter(Boolean);
      if(parts[0]==='shorts' && parts[1]) return `https://www.youtube.com/embed/${parts[1]}`;
      if(parts[0]==='live' && parts[1]) return `https://www.youtube.com/embed/${parts[1]}`;
    }
  }catch(e){}
  return raw;
}

    }
    Object.values(data).reverse().forEach(fb => {

async function loadCurrentUserProfile() {
  return new Promise((resolve) => {
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        currentUserProfile = null;
        currentUserRole = 'guest';
        updateFeedbackUI();
        return resolve(null);
      }
      try {
        currentUserRole = await TU.getRole(db, user.uid);
        const snap = await db.ref(`users/${user.uid}`).once('value');
        const doc = snap.val() || {};
        const displayName = (doc.displayName || user.displayName || (user.email ? user.email.split('@')[0] : 'User')).trim();
        const surename = (doc.surename || '').trim();
        const group = (doc.groupInUniversity || doc.group || '').trim();
        const avatar = (doc.avatarURL || doc.photoURL || user.photoURL || 'https://cdn-icons-png.flaticon.com/512/8241/8241956.png');
        currentUserProfile = {
          uid: user.uid,
          email: user.email || '',
          displayName,
          surename,
          group,
          avatar,
          role: currentUserRole,
        };
        selectedUserAvatar = avatar;
      } catch (e) {
        console.warn(e);
      }
      updateFeedbackUI();
      resolve(currentUserProfile);
    });
  });
}
function updateFeedbackUI() {

  const welcome = document.getElementById('welcome-user');
  const nameField = document.getElementById('fb-name');
  const surnameField = document.getElementById('fb-surname');
  const groupField = document.getElementById('fb-group');

  if (!currentUserProfile) {
    identitySection.style.display = 'block';
    if (avatarWrapper) avatarWrapper.style.display = 'block';
    if (welcome) welcome.style.display = 'none';
    return;
  }
  identitySection.style.display = 'none';
  if (avatarWrapper) avatarWrapper.style.display = 'none';
  if (nameField) nameField.value = currentUserProfile.displayName || '';
  if (surnameField) surnameField.value = currentUserProfile.surename || '';
  if (groupField) groupField.value = currentUserProfile.group || '';
  if (welcome) {
    const g = currentUserProfile.group ? ` <small>(${currentUserProfile.group})</small>` : '';
    welcome.innerHTML = `

    `;
    welcome.style.display = 'flex';
    welcome.style.alignItems = 'center';
  }
}

function normalizeName(str) {
  if (!str) return "";
  return str.toLowerCase()
    .replace(/x/g, 'h')
    .replace(/X/g, 'H')
    .replace(/kh/g, 'h')
    .replace(/Kh/g, 'H')
    .replace(/o'/g, 'o')
    .replace(/O'/g, 'O')
    .replace(/g'/g, 'g')
    .replace(/G'/g, 'G')
    .replace(/\s+/g, '');
}
async function submitFeedback() {
  const messageField = document.getElementById('fb-message');
  const message = (messageField?.value || '').trim();
  if (!message) {
    alert("Iltimos, xabar maydonini to'ldiring!");
    return;
  }
  if (!currentUserProfile || !auth.currentUser) {
    alert("Feedback qoldirish uchun avval akkauntga kiring.");
    const root = getRootPathSafe();
    window.location.href = `${root}/auth/login.html`;
    return;
  }
  if (!currentUserProfile.displayName || currentUserProfile.displayName.length < 2) {
    alert("Account sahifasidan ismingizni sozlab oling.");
    const root = getRootPathSafe();
    window.location.href = `${root}/pages/account/account.html`;
    return;
  }
  const courseRef = db.ref(`feedbacks/${CLUB_ID}/${TEACHER_ID}/${currentCourseKey}`);
  try {
    const role = currentUserRole || 'user';
    const feedbackEntry = {
      uid: auth.currentUser.uid,
      displayName: currentUserProfile.displayName,
      surename: currentUserProfile.surename || '',
      group: currentUserProfile.group || '',
      message: message,
      avatar: currentUserProfile.avatar || 'https://cdn-icons-png.flaticon.com/512/8241/8241956.png',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      isAdmin: role === 'admin',
      isTeacher: role === 'teacher'
    };
    await courseRef.push(feedbackEntry);
    messageField.value = "";
  } catch (err) {
    alert("Xatolik yuz berdi: " + (err?.message || err));
  }
}
const slider = document.getElementById('videoScrollable');
let isDown = false;
let startX;
let scrollLeft;
if (slider) {
  slider.addEventListener('mousedown', (e) => {
    isDown = true;
    startX = e.pageX - slider.offsetLeft;
    scrollLeft = slider.scrollLeft;
  });
  slider.addEventListener('mouseleave', () => isDown = false);
  slider.addEventListener('mouseup', () => isDown = false);
  slider.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - slider.offsetLeft;
    const walk = (x - startX) * 2; 
    slider.scrollLeft = scrollLeft - walk;
  });
}

}

<script>
document.addEventListener('DOMContentLoaded', () => {
    const makeFocusable = () => {
        document.querySelectorAll('.course-card, .tab, .avatar-item').forEach(el => {
            if (!el.hasAttribute('tabindex')) {
                el.setAttribute('tabindex', '0');
            }
        });
    };
    makeFocusable();
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;
        const focusableSelectors = 'a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
        const elements = Array.from(document.querySelectorAll(focusableSelectors))
            .filter(el => el.offsetWidth > 0 && el.offsetHeight > 0);
        if (elements.length === 0) return;
        const firstEl = elements[0];
        const lastEl = elements[elements.length - 1];
        if (e.shiftKey && document.activeElement === firstEl) {
            e.preventDefault();
            lastEl.focus();
        } else if (!e.shiftKey && document.activeElement === lastEl) {
            e.preventDefault();
            firstEl.focus();
        }
    });
    document.addEventListener('keydown', (e) => {
        const active = document.activeElement;
        if ((e.key === 'Enter' || e.key === ' ') && 
            (active.classList.contains('course-card') || active.classList.contains('tab') || active.classList.contains('avatar-item'))) {
            e.preventDefault();
            active.click();
        }
        if (active.classList.contains('course-card')) {
            const cards = Array.from(document.querySelectorAll('.course-card'));
            const idx = cards.indexOf(active);
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                (cards[idx + 1] || cards[0]).focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                (cards[idx - 1] || cards[cards.length - 1]).focus();
            }
        }
        if (active.classList.contains('tab')) {
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const idx = tabs.indexOf(active);
            let nextTab;
            if (e.key === 'ArrowRight') nextTab = tabs[idx + 1] || tabs[0];
            if (e.key === 'ArrowLeft') nextTab = tabs[idx - 1] || tabs[tabs.length - 1];
            if (nextTab) {
                nextTab.focus();
                nextTab.click();
            }
        }
    });
    const observer = new MutationObserver(makeFocusable);
    observer.observe(document.body, { childList: true, subtree: true });
});

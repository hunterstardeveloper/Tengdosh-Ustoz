<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tengdosh-Ustoz | Global Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/pages/chat/global-chat.css">
  <link rel="icon" href="/icon.png">
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <div class="page-scroll" id="page-scroll">

    <nav class="navbar" id="main-navbar">
      <a href="/home.html" class="navbar-brand">
        <div class="navbar-brand-logo"><img src="/logo.png" alt="logo"></div>
        <span class="navbar-wordmark"><span class="w1">Tengdosh</span><span class="w2">Ustoz</span></span>
      </a>
      <ul class="navbar-links" id="navbar-links" role="list">
        <li>
          <a href="/home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span data-i18n="nav_home">Home</span>
          </a>
        </li>
        <li>
          <a href="/pages/classes/classes.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span data-i18n="nav_mentors">Mentors</span>
          </a>
        </li>
        <li>
          <a href="/pages/chat/global_chat.html" class="active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span data-i18n="nav_chat">Chat</span>
          </a>
        </li>
        <li>
          <a href="/pages/contact/contact.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span data-i18n="nav_contact">Contact</span>
          </a>
        </li>
        <li>
          <a href="/pages/account/account.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="nav_account">Account</span>
          </a>
        </li>
      </ul>
      <div class="navbar-right">
        <a href="/pages/account/account.html" class="navbar-avatar" id="navbar-avatar" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <button id="theme-toggle" aria-label="Toggle Dark Mode">
          <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="navbar-hamburger" id="navbar-hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navbar-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <main class="chat-page">
      <div class="chat-shell glass">

        <div class="chat-header">
          <div class="chat-header-left">
            <div class="chat-icon-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div>
              <div class="chat-header-title" data-i18n="chat_header_title">Global Student Chat</div>
              <div class="chat-header-sub" data-i18n="chat_header_sub">All users across Tengdosh-Ustoz</div>
            </div>
          </div>
          <div class="chat-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText" data-i18n="chat_connecting">Connectingâ€¦</span>
            <span class="user-badge" id="userBadge"></span>
          </div>
        </div>

        <div class="chat-body" id="chatList">
          <div class="empty-state" id="emptyState">
            <div class="loading-spinner"></div>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p data-i18n="chat_empty">Connecting to the global communityâ€¦</p>
          </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
          <span class="typing-text"></span>
        </div>

        <div class="chat-footer" id="chatFooter">
          <form class="chat-input-row" id="chatForm" autocomplete="off">
            <div class="input-wrap">
              <textarea
                class="chat-input"
                id="chatInput"
                data-i18n-ph="chat_placeholder"
                placeholder="Write a messageâ€¦"
                maxlength="500"
                rows="1"
              ></textarea>
            </div>
            <button class="send-btn" id="sendBtn" type="submit">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              <span data-i18n="chat_send">Send</span>
            </button>
          </form>
          <div class="chat-hint">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span data-i18n="chat_hint">Messages are public to all students</span>
          </div>
        </div>

        <div class="auth-banner" id="authBanner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>
            <span data-i18n="chat_auth_msg">You must be logged in to send messages.</span>
            <a href="/pages/account/account.html" data-i18n="chat_auth_link">Sign in</a>
          </span>
        </div>

      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="/assets/firebase-config.js"></script>
  <script src="/assets/tu-firebase.js"></script>
  <script src="/script-internet-checker.js"></script>
  <script src="/assets/i18n.js"></script> 
  <script src="/pages/chat/global-chat.js"></script>

	<script src="/sw.js"></script>
	<script src="/assets/UI.js"></script>
</body>
</html>

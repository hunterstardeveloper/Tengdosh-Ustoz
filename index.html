<!doctype html>
<html lang="en" data-theme="dark">
<head>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://media.giphy.com" crossorigin>
<link rel="preconnect" href="https://ik.imagekit.io" crossorigin>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tengdosh Ustoz â€“ Intro</title>
  <style>
    :root{
      --bg0:#050607;
      --bg1:#0a0f0d;
      --green:#1CFF7A;
      --green2:#00D86A;
      --lime:#D8FF3A;
      --yellow:#FFE95A;
      --text:#E9ECEF;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg0);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    .stage{
      position:fixed; inset:0;
      display:grid; place-items:center;
      background:
        radial-gradient(1200px 700px at 50% 45%, rgba(0,0,0,0.0), rgba(0,0,0,0.82) 62%, rgba(0,0,0,0.95)),
        radial-gradient(900px 520px at 50% 58%, rgba(20,255,130,0.06), rgba(0,0,0,0) 58%),
        linear-gradient(180deg,var(--bg1),var(--bg0));
    }

    .logoWrap{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      transform: translateY(-6px);
      padding: 0;           /* no box padding */
      width: auto;          /* no fixed width */
    }

    .logo{
      width:min(190px,36vw);
      opacity:0;
      transform: translateY(10px) scale(0.985);
      will-change: transform, opacity, filter;
      filter:
        drop-shadow(0 0 12px rgba(0,255,140,0.28))
        drop-shadow(0 0 26px rgba(0,255,140,0.14));
    }

    .brand{
      font-size: clamp(20px, 6vw, 34px);
      letter-spacing:0.4px;
      line-height:1.1;
      opacity:0;
      transform: translateY(12px);
      color:var(--text);
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
      will-change: transform, opacity, text-shadow;
      user-select:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }
    .brandLine{
      display:inline-flex;
      gap:10px;
      align-items:baseline;
      justify-content:center;
      white-space:nowrap;
    }
    .brand .accent{
      color: var(--yellow);
      text-shadow:
        0 0 10px rgba(255,233,90,0.25),
        0 0 28px rgba(80,255,160,0.14);
      font-weight:700;
    }

    .bar{
      width:min(520px,78vw);
      height:8px;
      border-radius:999px;
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset;
      overflow:hidden;
      position:relative;
      opacity:0;
      transform: translateY(10px);
      will-change: opacity, transform;
    }
    .fill{
      height:100%;
      width:0%;
      border-radius:999px;
      background: linear-gradient(90deg, #2BFF87, #00D86A, #D8FF3A, #FFE95A);
      filter: drop-shadow(0 0 10px rgba(0,255,140,0.22));
      position:relative;
    }
    .fill::after{
      content:"";
      position:absolute; top:0; bottom:0;
      width:64px;
      left:-80px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,0.20),
        rgba(255,255,255,0)
      );
      opacity:0.70;
      animation: sweep 1.2s linear infinite;
    }
    @keyframes sweep{
      from{ transform: translateX(0); }
      to{ transform: translateX(740px); }
    }

    .bar.pulse{ animation: pulse 520ms ease-out 1; }
    @keyframes pulse{
      0%{ box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 0 rgba(0,0,0,0); }
      40%{ box-shadow: 0 0 0 1px rgba(255,255,255,0.10) inset, 0 0 34px rgba(0,255,140,0.14); }
      100%{ box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 0 rgba(0,0,0,0); }
    }

    .vignette{
      position:fixed; inset:0;
      background: radial-gradient(70% 55% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.66) 86%, rgba(0,0,0,0.90));
      pointer-events:none;
    }

    .fadeout{
      animation: fadeout 380ms ease-in forwards;
    }
    @keyframes fadeout{
      to{ opacity:0; transform: translateY(-2px) scale(0.99); filter: blur(0.2px); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="logoWrap" id="group">
      
      <svg class="logo" id="logo" viewBox="0 0 256 256" aria-label="Logo" role="img">
        <path fill="url(#gMain)"
          d="
            M 86 40
            L 120 40
            L 120 150
            C 120 168 130 178 148 178
            C 166 178 176 168 176 150
            L 176 108
            L 206 108
            L 206 150
            C 206 187 180 214 148 214
            C 116 214 90 187 90 150
            L 90 70
            Z
          "
        />
        <polygon points="86,40 120,40 86,74" fill="#10E97A" opacity="0.95"/>
        <rect x="120" y="65" width="44" height="34" rx="4" fill="url(#gYellow)"/>
        <defs>
          <linearGradient id="gMain" x1="86" y1="40" x2="206" y2="214" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2BFF87"/>
            <stop offset="1" stop-color="#00D86A"/>
          </linearGradient>
          <linearGradient id="gYellow" x1="136" y1="94" x2="190" y2="116" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D8FF3A"/>
            <stop offset="1" stop-color="#FFE95A"/>
          </linearGradient>
        </defs>
      </svg>

      
      <div class="brand" id="brand">
        <div class="brandLine">
          <span>Tengdosh</span>
          <span class="accent">Ustoz</span>
        </div>

        <div class="bar" id="bar" aria-label="Loading bar">
          <div class="fill" id="fill"></div>
        </div>
      </div>
    </div>

    <div class="vignette"></div>
  </div>
  <script>
    const groupEl = document.getElementById("group");
    const logoEl  = document.getElementById("logo");
    const brandEl = document.getElementById("brand");
    const barEl   = document.getElementById("bar");
    const fillEl  = document.getElementById("fill");

    const clamp01 = (x)=>Math.max(0,Math.min(1,x));
    const easeOutCubic = (x)=>1-Math.pow(1-x,3);

    const REVEAL_MS = 850;
    const BAR_DELAY_MS = 380;
    const FILL_MS = 2400;
    const HOLD_MS = 450;
    const FADE_MS = 320;

    let start = performance.now();
    let barStart = null;
    let redirected = false;

    function setReveal(p){
      const e = easeOutCubic(clamp01(p));

      logoEl.style.opacity = e.toFixed(3);
      logoEl.style.transform = `translateY(${(1-e)*12}px) scale(${0.985 + e*0.015})`;
      logoEl.style.filter =
        `drop-shadow(0 0 ${12 + e*8}px rgba(0,255,140,${0.22 + e*0.18}))
         drop-shadow(0 0 ${26 + e*28}px rgba(150,255,80,${0.10 + e*0.12}))`;

      brandEl.style.opacity = e.toFixed(3);
      brandEl.style.transform = `translateY(${(1-e)*14}px)`;

      barEl.style.opacity = e.toFixed(3);
      barEl.style.transform = `translateY(${(1-e)*10}px)`;
    }
    function redirectToHome(){
      if (redirected) return;
      redirected = true;
      groupEl.classList.add("fadeout");
      setTimeout(()=>{ window.location.href = "home.html"; }, FADE_MS);
    }
    function animate(now){
      const t = now - start;
      setReveal(t / REVEAL_MS);
      if (!barStart && t > BAR_DELAY_MS) barStart = now;
      if (barStart && !redirected){
        const bt = now - barStart;
        if (bt < FILL_MS){
          const p = easeOutCubic(bt / FILL_MS);
          fillEl.style.width = (p * 100).toFixed(2) + "%";
          barEl.classList.remove("pulse");
        } else {
          fillEl.style.width = "100%";
          if (!barEl.classList.contains("pulse")) barEl.classList.add("pulse");

          if (bt > FILL_MS + HOLD_MS) redirectToHome();
        }
      }
      if (!redirected) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    addEventListener("click", redirectToHome);
  </script>
  <script src="assets/preventer.js"></script>
  <script src="/assets/firebase-config.js"></script>
  <script src="/assets/tu-firebase.js"></script>
  <script src="/assets/UI.js"></script>
</body>
</html>
